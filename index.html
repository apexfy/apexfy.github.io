.sc{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -16px;padding:2px 16px}.sc::-webkit-scrollbar{display:none}.sc button{flex:none;width:118px;scroll-snap-align:start;background:var(--c2);border-radius:18px;padding:14px 12px;text-align:left;border:1px solid transparent;transition:.2s}.sc button.on{border-color:var(--pu);background:color-mix(in srgb,var(--pu) 16%,var(--c2))}.sc b{display:block;font:700 14px Sora,sans-serif}.sc span{font-size:11px;color:var(--mu)}

<div id="app"><div id="view" style="display:contents"><div style="padding:28px"><h1 style="font-size:28px">Apexfy</h1><p>Free focus app with a Pomodoro timer, single-task focus view, ambient soundscapes, an AI productivity coach and silent co-working rooms.</p></div></div>

<div class="sb" id="sb"><div class="row"><input id="q" placeholder="Search rooms, tasks, posts" aria-label="Search" style="margin:0"><button class="gh" id="sx">Close</button></div><div id="sr" style="margin-top:10px"></div></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MEM={};
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?(k in MEM?MEM[k]:d):JSON.parse(v)}catch(e){return k in MEM?MEM[k]:d}},set(k,v){MEM[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const buzz=n=>{try{S.haptic&&navigator.vibrate&&navigator.vibrate(n||12)}catch(e){}};
let th;const say=(m,bad)=>{const t=$('#toast');t.textContent=m;t.className='toast on'+(bad?' bad':'');clearTimeout(th);th=setTimeout(()=>t.classList.remove('on'),2200)};
const fmt=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return(h?h+':':'')+String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const ini=n=>(n||'?').split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
const RANKS=[['Spark',0],['Flow',500],['Apex I',1500],['Apex II',4000],['Apex III',8000]];
const PERK={'Spark':'Public rooms','Flow':'Custom status','Apex I':'Private rooms','Apex II':'Host rooms','Apex III':'Priority access'};
const SEEDG=()=>[{id:'g1',name:'Mobile Builders',niche:['app development','mobile development','react native'],emoji:'📱',admin:'demo',owner:'Lena R.',members:['Lena R.','Jonas T.'],img:''},{id:'g2',name:'UI/UX Circle',niche:['ui/ux design','product design','design'],emoji:'🎨',admin:'demo',owner:'Aya Y.',members:['Aya Y.','Omar K.','Nora B.'],img:''},{id:'g3',name:'AI Automation Lab',niche:['ai','ai automation','automation'],emoji:'🤖',admin:'demo',owner:'Sam P.',members:['Sam P.'],img:''},{id:'g4',name:'Medical Study Hub',niche:['medicine','exam prep','study'],emoji:'🩺',admin:'demo',owner:'Dr. Hana',members:['Dr. Hana','Karim'],img:''}];
const S={ct:'feed',feed:ls.get('apx_feed',[]),groups:ls.get('apx_groups',null)||SEEDG(),email:null,user:null,D:null,tab:'flow',room:null,mode:'pomo',run:false,brk:false,len:25,end:0,start:0,up:0,dist:0,theme:ls.get('apx_theme','dark'),haptic:true,snd:null,msgs:ls.get('apx_msgs',{}),peers:[],roomApi:null,sample:null,ai:'',aiBusy:false};
document.documentElement.dataset.theme=S.theme;
const day=t=>new Date(t).toDateString();
const MARK='<svg width="26" height="26" viewBox="0 0 26 26" fill="none"><path d="M2 21L13 3l11 18h-6.5L13 12.5 8.5 21z" fill="var(--cy)"/></svg>';

/* ---------- auth (email + password, stored on this device) ---------- */
async function hash(p,salt){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function signUp(name,email,pw){
  const U=ls.get('apx_users',{});if(U[email])throw'This email already has an account. Sign in instead.';
  const salt=crypto.getRandomValues(new Uint32Array(2)).join('');U[email]={salt,h:await hash(pw,salt)};ls.set('apx_users',U);
  ls.set('apx_d_'+email,{name,age:'',loc:'',skills:['App development','UI/UX design'],tasks:[],sessions:[],posts:[],cur:null});login(email)}
async function signIn(email,pw){const u=ls.get('apx_users',{})[email];if(!u||await hash(pw,u.salt)!==u.h)throw'Email or password is incorrect.';login(email)}
function login(email){S.email=email;S.D=ls.get('apx_d_'+email);S.D.goals=S.D.goals||[];S.D.bio=S.D.bio||'';S.D.links=S.D.links||[];S.D.dgoal=S.D.dgoal||120;S.D.seen=S.D.seen||[];S.D.joined=S.D.joined||[];S.uid=[...email].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7).toString(16);S.dm=null;ls.set('apx_session',email);S.tab='flow';S.room=null;joinRoom();render()}
function logout(){stopSound();clearInterval(tk);S.run=false;S.email=null;S.D=null;ls.set('apx_session',null);dr(false);render()}
const save=()=>ls.set('apx_d_'+S.email,S.D);

/* ---------- stats ---------- */
const xp=()=>S.D.sessions.reduce((a,s)=>a+Math.max(0,s.min*5-s.dist*10),0);
const hrs=()=>S.D.sessions.reduce((a,s)=>a+s.min,0)/60;
const rank=()=>{const x=xp();let i=0;RANKS.forEach((r,k)=>{if(x>=r[1])i=k});return i};
const streak=()=>{const d=new Set(S.D.sessions.map(s=>day(s.t)));let n=0,t=Date.now();if(!d.has(day(t)))t-=864e5;while(d.has(day(t))){n++;t-=864e5}return n};
function score(){const td=S.D.sessions.filter(s=>day(s.t)===day(Date.now()));if(!td.length)return null;const m=td.reduce((a,s)=>a+s.min,0),ds=td.reduce((a,s)=>a+s.dist,0);return Math.max(0,Math.min(100,Math.round(100*Math.min(1,m/(S.D.dgoal||120))-ds*8)))}
function peak(){const h={};S.D.sessions.forEach(s=>{const k=new Date(s.t).getHours();h[k]=(h[k]||0)+s.min});const e=Object.entries(h).sort((a,b)=>b[1]-a[1])[0];return e?+e[0]:null}
function tip(){const sc=score(),p=peak(),ds=S.D.sessions.slice(-5).reduce((a,s)=>a+s.dist,0);
  if(!S.D.sessions.length)return'Finish your first session and I will start tracking your peak hours and distractions.';
  return(p!=null?`Your peak focus hour is ${p}:00. Put your hardest task there. `:'')+(ds>2?`You left the app ${ds} times in your last 5 sessions. Try Strict Mode and silence notifications.`:'Distractions are low lately. Try a longer block of 50 minutes.')}

/* ---------- timer (timestamp based, so it stays accurate in background) ---------- */
let tk=null;
const left=()=>Math.max(0,Math.round((S.end-Date.now())/1000));
function start(){S.run=true;S.dist=0;S.start=Date.now();if(S.mode==='pomo')S.end=Date.now()+(S.brk?5:S.len)*60000;buzz(30);if(S.strict&&S.mode==='pomo'&&!S.brk)lockOn();tk=setInterval(tick,500);render()}
function tick(){if(S.mode==='pomo'&&left()<=0)return done(true);paint()}
function paint(){const t=$('#tt');if(!t)return;const sec=S.mode==='pomo'?left():Math.round((Date.now()-S.start)/1000);t.textContent=fmt(sec);const tot=S.brk?300:S.len*60;const p=S.mode==='pomo'?1-sec/tot:(sec%3600)/3600;$('#arc').setAttribute('stroke-dashoffset',(691*(1-p)).toFixed(1))}
function done(full){clearInterval(tk);lockOff();const el=(Date.now()-S.start)/60000;const min=full?(S.brk?0:S.len):Math.floor(el);S.run=false;
  if(!S.brk&&min>=1){const g=Math.max(0,min*5-S.dist*10);S.D.sessions.push({t:Date.now(),min,dist:S.dist,task:cur()?.t||'Open focus',mode:S.mode});const gl=S.D.goals.find(x=>x.id===S.D.gcur&&!x.done);if(gl){gl.min+=min;if(gl.min>=gl.target){gl.done=true;S.D.gcur=null;setTimeout(()=>say('Goal complete: '+gl.t),2400)}}save();setTimeout(checkBadges,4600);
    say(`+${g} XP · ${min} min logged`+(S.dist?` · ${S.dist} distraction penalty`:''));buzz([40,60,40])}
  else if(!S.brk)say('Session too short to log');
  if(S.mode==='pomo'&&full)S.brk=!S.brk;else S.brk=false;render()}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.run&&!S.brk&&S.strict!==false){S.dist++;S.hid=1}else if(!document.hidden&&S.hid){S.hid=0;buzz([60,40,60]);if(S.lockOn){S.warn='away';render(true)}else say('Distraction logged. Strict Mode penalty applied.',1)}});
S.strict=ls.get('apx_strict',true);
const cur=()=>S.D.tasks.find(t=>t.id===S.D.cur&&!t.done);

/* ---------- sound (Web Audio, generated on device) ---------- */
let AC,nodes=[];
function noiseSrc(){const b=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),d=b.getChannelData(0);let l=0;for(let i=0;i<d.length;i++){const w=Math.random()*2-1;d[i]=S._br?(l=(l+.02*w)/1.02)*3.5:w}const s=AC.createBufferSource();s.buffer=b;s.loop=true;s.start();return s}
function stopSound(){nodes.forEach(n=>{try{n.stop?n.stop():n.disconnect()}catch(e){}});nodes=[];S.snd=null}
function playSound(k){stopSound();AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume();const g=AC.createGain();g.gain.value=.35;g.connect(AC.destination);nodes.push(g);
  if(k==='White noise'){const n=noiseSrc();n.connect(g);nodes.push(n)}
  else if(k==='Rain'){const n=noiseSrc(),f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=900;const l=AC.createBiquadFilter();l.type='lowpass';l.frequency.value=7000;n.connect(f);f.connect(l);l.connect(g);nodes.push(n)}
  else{const hz=k==='Alpha'?10:20;[[200,-1],[200+hz,1]].forEach(([f,p])=>{const o=AC.createOscillator();o.frequency.value=f;const pn=AC.createStereoPanner();pn.pan.value=p;const og=AC.createGain();og.gain.value=.5;o.connect(pn);pn.connect(og);og.connect(g);o.start();nodes.push(o)})}
  S.snd=k}

function roomsV(){const live=S.peers.slice(0,8);return `<div class="cd" style="padding:8px">${CH.map(([c,l])=>`<div class="cat">${c}</div>`+l.map(n=>`<button class="ch" data-r="${n}"><span style="width:20px;color:var(--mu)">${n==='Silent focus'?'◔':'#'}</span><span style="flex:1">${n}</span><span class="live">${n==='Silent focus'?'Synced timer':''}</span></button>`).join('')).join('')}</div>
 <div class="cd"><h2>Live now</h2>${live.length?live.map(p=>`<div class="row" style="padding:7px 0"><span class="row" style="justify-content:flex-start"><span class="av">${esc(ini(p.presence.name))}</span><b>${esc(p.isMe?p.presence.name+' (you)':p.presence.name)}</b></span><span class="mu" style="text-align:right">${esc(p.presence.status||'')}</span></div>`).join(''):`<div class="row" style="padding:7px 0"><b>${esc(S.D.name)} (you)</b><span class="mu">${S.run?'In a Flow Session':'Idle'}</span></div><p class="mu">${S.roomApi===false?'Live presence needs the claude.ai version.':'Others who open Apexfy will show up here.'}</p>`}</div>`}
function joinG(id){const g=S.groups.find(x=>x.id===id);if(!g)return;const sk=S.D.skills.map(x=>x.toLowerCase());
 const ok=g.admin===S.uid||g.niche.some(n=>{n=n.toLowerCase();return sk.some(x=>n.length<3||x.length<3?x===n:x.includes(n)||n.includes(x))});
 if(!ok){S.modal={t:'Niche mismatch',m:g.name+' is for '+g.niche.join(', ')+'. Add a matching skill to your profile to join, or look for a group in your field.'};buzz([40,40]);render(true);return}
 S.D.joined.push(g.id);if(!g.members.includes(S.D.name))g.members.push(S.D.name);saveG();save();say('Welcome to '+g.name);buzz([20,40,20]);render(true)}
function groupV(){const g=S.groups.find(x=>x.id===S.room.group);if(!g){S.room=null;return comm()}const adm=g.admin===S.uid;
 const head=`<div class="row" style="margin-top:4px"><button class="gh" id="back" style="padding:10px 16px">Back</button><span class="row" style="gap:8px;min-width:0"><span class="ga" style="width:32px;height:32px;font-size:16px">${okImg(g.img)?`<img src="${g.img}" alt="">`:esc(g.emoji||'◆')}</span><b class="d" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(g.name)}</b></span>${adm?`<button class="gh" id="gset" style="padding:10px 14px">Admin</button>`:'<span style="width:70px"></span>'}</div>`;
 if(adm&&S.gset)return head+`<div class="cd"><h2>Group settings</h2><input id="gn" value="${esc(g.name)}" aria-label="Group name"><div style="display:flex;gap:8px;margin-top:8px"><input id="ge" value="${esc(g.emoji||'')}" maxlength="2" aria-label="Emoji" style="margin:0;width:80px"><label class="gh" style="flex:1;text-align:center;cursor:pointer">Upload image<input id="gimg" type="file" accept="image/*" hidden></label></div><button class="cta" id="gsave" style="margin-top:12px;width:100%">Save changes</button></div><div class="cd"><h2>Members · ${g.members.length}</h2>${g.members.map(m=>`<div class="row" style="padding:8px 0"><span>${esc(m)}${m===g.owner?' <span class="mu">admin</span>':''}</span>${m!==g.owner?`<button class="mu" data-rm="${esc(m)}">Remove</button>`:''}</div>`).join('')}</div>`;
 return head+chat()}

/* profile */
function you(){const D=S.D,r=rank(),x=xp(),nx=RANKS[r+1],pr=nx?(x-RANKS[r][1])/(nx[1]-RANKS[r][1]):1,h=hrs(),mine=S.feed.filter(p=>p.uid===S.uid).sort((a,b)=>b.at-a.at);
 return `<div class="cd"><div class="row" style="justify-content:flex-start;gap:14px"><span class="av" style="width:68px;height:68px;font-size:24px">${esc(ini(D.name))}</span><div style="min-width:0"><h1 style="font-size:21px">${esc(D.name)}</h1><div class="mu">${esc([D.age,D.loc].filter(Boolean).join(' · ')||'Add your age and location')}</div></div></div>
 ${D.bio?`<p style="margin-top:12px;overflow-wrap:anywhere;white-space:pre-wrap">${esc(D.bio)}</p>`:''}
 <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:12px">${D.skills.map(s=>`<span class="chip on">${esc(s)}</span>`).join('')}</div>
 ${D.links.length?`<div class="lk" style="margin-top:12px;display:flex;flex-wrap:wrap;gap:6px 14px">${D.links.map(l=>`<a href="${esc(l.u)}" target="_blank" rel="noopener noreferrer">${esc(l.l)}</a>`).join('')}</div>`:''}
 ${S.editing?`<input id="en" value="${esc(D.name)}" aria-label="Name" placeholder="Name"><input id="ea" value="${esc(D.age)}" aria-label="Age" placeholder="Age"><input id="el" value="${esc(D.loc)}" aria-label="Location" placeholder="Location"><textarea id="eb" aria-label="Bio" placeholder="Short bio" maxlength="240" style="width:100%;background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-top:8px;height:80px">${esc(D.bio)}</textarea><input id="ek" value="${esc(D.skills.join(', '))}" aria-label="Skills" placeholder="Services and skills, comma separated"><textarea id="elk" aria-label="Links" placeholder="Links, one per line: Label url" style="width:100%;background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-top:8px;height:80px">${esc(D.links.map(l=>l.l+' '+l.u).join('\n'))}</textarea><button class="cta" id="esave" style="margin-top:12px;width:100%">Save profile</button>`:`<button class="gh" id="edit" style="margin-top:14px;width:100%">Edit profile</button>`}</div>
 <div class="cd"><h2>Achievements · ${h.toFixed(1)}h deep work</h2><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">${TIERS.map(t=>badge(t,h>=t.h)).join('')}</div></div>
 <div class="cd"><h2>Rank and XP</h2><div class="big" style="color:var(--pu)">${RANKS[r][0]}</div><div class="mu">${x} XP${nx?` · ${nx[1]-x} to ${nx[0]}`:' · top rank'} · Unlocked: ${PERK[RANKS[r][0]]}</div><div class="bar" style="margin-top:12px"><i style="width:${pr*100}%;background:var(--pu)"></i></div>
 <div class="st"><div><b style="color:var(--cy)">${h.toFixed(1)}h</b><span class="mu">Deep work</span></div><div><b>${D.sessions.length}</b><span class="mu">Sessions</span></div><div><b style="color:var(--gr)">${streak()}</b><span class="mu">Day streak</span></div></div></div>
 <div class="cd"><h2>Portfolio</h2><textarea id="pc" placeholder="Describe your work or share an insight" aria-label="Caption" maxlength="500" style="width:100%;background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;height:84px">${esc(S.pc||'')}</textarea>
 <div style="display:flex;gap:8px;margin-top:8px"><label class="gh" style="flex:1;text-align:center;cursor:pointer">${S.pimg?'Image attached':'Add image'}<input id="pimg" type="file" accept="image/*" hidden></label><button class="cta" id="ppost" style="flex:1;padding:12px">Publish</button></div>
 ${D.sessions.length?`<button class="chip" id="share" style="margin-top:10px">Share my progress</button>`:''}</div>
 ${mine.map(postH).join('')||'<p class="mu" style="text-align:center;padding:14px">Your published posts appear here and in the Community feed.</p>'}`}

/* direct messages */
const DMK=()=>'apx_dm_'+S.email;
function dmAdd(uid,name,me,txt){const T=ls.get(DMK(),{});const t=T[uid]=T[uid]||{name,m:[]};t.name=name;t.m.push({me,txt,t:Date.now()});t.m=t.m.slice(-100);if(!me)t.u=(t.u||0)+1;ls.set(DMK(),T)}
const dmUnread=()=>{try{return Object.values(ls.get(DMK(),{})).reduce((a,t)=>a+(t.u||0),0)}catch(e){return 0}};
function dmView(){const T=ls.get(DMK(),{});
 if(S.dm){const t=T[S.dm]||{name:S.dmName,m:[]};if(T[S.dm]&&T[S.dm].u){T[S.dm].u=0;ls.set(DMK(),T)}
  return `<div class="row" style="margin-top:4px"><button class="gh" id="dback" style="padding:10px 16px">Back</button><b class="d">${esc(t.name)}</b><span style="width:70px"></span></div>${S.dm.startsWith('demo')?'<p class="mu" style="margin-top:10px">This is a sample account. It won’t reply.</p>':''}<div class="cd">${t.m.length?t.m.map(x=>`<div style="display:flex;justify-content:${x.me?'flex-end':'flex-start'};margin:8px 0"><span style="max-width:80%;padding:10px 14px;border-radius:16px;background:${x.me?'var(--cy)':'var(--c2)'};color:${x.me?'var(--on)':'var(--tx)'};overflow-wrap:anywhere;white-space:pre-wrap">${esc(x.txt)}</span></div>`).join(''):'<p class="mu">Say hello.</p>'}</div><div class="cmp" style="margin-top:10px"><textarea id="di" placeholder="Message" aria-label="Message"></textarea><button class="cta" id="dsend" style="padding:14px 18px">Send</button></div>`}
 const ks=Object.keys(T).sort((a,b)=>T[b].m[T[b].m.length-1].t-T[a].m[T[a].m.length-1].t);
 return `<h1 class="d" style="font-size:22px;margin:8px 0">Messages</h1>${ks.length?`<div class="cd" style="padding:6px">${ks.map(k=>{const t=T[k],l=t.m[t.m.length-1];return `<button class="ch" data-dmo="${esc(k)}"><span class="av">${esc(ini(t.name))}</span><span style="flex:1;min-width:0"><b>${esc(t.name)}</b><div class="mu" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(l.txt)}</div></span>${t.u?`<span class="live">${t.u} new</span>`:''}</button>`}).join('')}</div>`:'<div class="cd"><p class="mu">No conversations yet. Tap Message on a post in the Community feed to start one.</p></div>'}<p class="mu" style="margin-top:12px">Beta: messages travel through the shared Apexfy room and are not private. Don’t share sensitive information.</p>`}

/* new click handlers */
function rsz(f,max,cb){const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.72))};i.src=r.result};r.readAsDataURL(f)}
const emit=(k,d)=>{if(S.roomApi)S.roomApi.emit(k,d).catch(()=>{})};
function newH(b,id,q){
 if(q.fv!==undefined){S.fv=q.fv||null;render();return 1}
 if(id==='ga'){const t=$('#gi').value.trim();if(!t)return 1;const g={id:Date.now(),t,target:Math.max(5,+$('#gm').value||60),min:0,done:false};S.D.goals.push(g);if(!S.D.gcur)S.D.gcur=g.id;save();render(true);return 1}
 if(q.gcur){S.D.gcur=+q.gcur;save();buzz(8);render(true);return 1}
 if(q.gdel){S.D.goals=S.D.goals.filter(x=>x.id!==+q.gdel);if(S.D.gcur===+q.gdel)S.D.gcur=null;save();render(true);return 1}
 if(q.dg){S.D.dgoal=+q.dg;save();render(true);return 1}
 if(id==='mx'){S.modal=null;render(true);return 1}
 if(id==='wk'){S.warn=null;try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen({navigationUI:'hide'}).catch(()=>{})}catch(e){}render(true);return 1}
 if(id==='wq'){S.warn=null;done(false);return 1}
 if(q.ct){S.ct=q.ct;S.mk=false;render();return 1}
 if(id==='mkg'){S.mk=!S.mk;if(S.ct==='rooms')S.ct='groups';render(true);return 1}
 if(id==='mkx'){S.mk=false;render(true);return 1}
 if(id==='sg'){S.ct='groups';S.gsearch=true;S.mk=false;render();setTimeout(()=>{const e=$('#gq');e&&e.focus()},60);return 1}
 if(id==='mksave'){const n=$('#mn').value.trim(),ni=$('#mi2').value.split(',').map(x=>x.trim()).filter(Boolean).slice(0,6);if(!n||!ni.length){say('Add a name and at least one niche',1);return 1}
  const g={id:'g'+Date.now().toString(36),name:n.slice(0,40),niche:ni,emoji:$('#me').value.trim()||'◆',img:'',admin:S.uid,owner:S.D.name,members:[S.D.name]};S.groups.push(g);S.D.joined.push(g.id);saveG();save();emit('group',g);S.mk=false;S.ct='groups';say('Group created');render();return 1}
 if(q.jg){joinG(q.jg);return 1}
 if(q.og){const g=S.groups.find(x=>x.id===q.og);S.room={n:'g:'+q.og,title:g.name,group:q.og};S.gset=false;render();return 1}
 if(id==='gset'){S.gset=!S.gset;render(true);return 1}
 if(id==='gsave'){const g=S.groups.find(x=>x.id===S.room.group);g.name=$('#gn').value.trim().slice(0,40)||g.name;g.emoji=$('#ge').value.trim()||g.emoji;S.room.title=g.name;S.gset=false;saveG();say('Group updated');render(true);return 1}
 if(q.rm){const g=S.groups.find(x=>x.id===S.room.group);g.members=g.members.filter(m=>m!==q.rm);saveG();render(true);return 1}
 if(q.like){const P=PI(),i=P[q.like]=P[q.like]||{liked:false,cm:[]};i.liked=!i.liked;ls.set('apx_pi',P);buzz(10);render(true);return 1}
 if(q.cm){S.open=S.open===q.cm?null:q.cm;render(true);return 1}
 if(q.csend){const v=$('#ci').value.trim();if(!v)return 1;const P=PI(),i=P[q.csend]=P[q.csend]||{liked:false,cm:[]};i.cm.push({by:S.D.name,t:v.slice(0,300)});ls.set('apx_pi',P);render(true);return 1}
 if(q.dm){const p=allPosts().find(x=>x.uid===q.dm);S.dm=q.dm;S.dmName=p?p.by:'User';S.tab='dm';S.room=null;render();return 1}
 if(q.dmo){S.dm=q.dmo;S.dmName=(ls.get(DMK(),{})[q.dmo]||{}).name||'User';render();return 1}
 if(id==='dmb'){S.tab='dm';S.dm=null;S.room=null;render();return 1}
 if(id==='dback'){S.dm=null;render();return 1}
 if(id==='dsend'){const v=$('#di').value.trim();if(!v)return 1;dmAdd(S.dm,S.dmName,true,v);emit('dm',{to:S.dm,from:S.uid,name:S.D.name,txt:v});buzz(8);render(true);$('#main').scrollTop=1e6;return 1}
 if(id==='ppost'){const t=($('#pc').value||'').trim();if(!t&&!S.pimg){say('Add a caption or an image',1);return 1}
  const p={id:'p'+Date.now(),uid:S.uid,by:S.D.name,t,img:S.pimg||'',at:Date.now(),l:0};S.feed.push(p);saveFeed();emit('post',{...p,img:p.img.length<45000?p.img:''});S.pimg=null;S.pc='';say('Published to the feed');buzz([20,40,20]);render(true);return 1}
 if(q.pdel){S.feed=S.feed.filter(x=>x.id!==q.pdel);saveFeed();render(true);return 1}
 if(id==='share'){const p={id:'p'+Date.now(),uid:S.uid,by:S.D.name,t:hrs().toFixed(1)+'h of deep work, '+xp()+' XP, rank '+RANKS[rank()][0]+', '+streak()+' day streak.',img:'',at:Date.now(),l:0};S.feed.push(p);saveFeed();emit('post',p);say('Shared to the feed');render(true);return 1}
 if(id==='esave'){S.D.name=$('#en').value.trim()||S.D.name;S.D.age=$('#ea').value.trim();S.D.loc=$('#el').value.trim();S.D.bio=$('#eb').value.trim().slice(0,240);S.D.skills=$('#ek').value.split(',').map(x=>x.trim()).filter(Boolean).slice(0,10);
  S.D.links=$('#elk').value.split('\n').map(x=>x.trim()).filter(Boolean).slice(0,6).map(x=>{const t=x.split(/\s+/);let u=t.pop();if(!/^https?:\/\//i.test(u)){if(/^[a-z]+:/i.test(u))return null;u='https://'+u}const l=t.join(' ')||u.replace(/^https?:\/\//i,'').split('/')[0];return{l:l.slice(0,30),u}}).filter(Boolean);S.editing=false;save();render(true);return 1}
 return 0}
document.addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;
 if(e.target.id==='pimg')rsz(f,560,u=>{S.pimg=u;say('Image attached');render(true)});
 if(e.target.id==='gimg')rsz(f,160,u=>{const g=S.groups.find(x=>x.id===S.room.group);g.img=u;saveG();render(true)})});
document.addEventListener('input',e=>{if(e.target.id==='gq'){S.gqv=e.target.value;$('#gl').innerHTML=glist(S.gqv)}if(e.target.id==='pc')S.pc=e.target.value});

function chat(){const m=S.msgs[S.room.n]||[];
  return `${S.room.group?'':`<div class="row" style="margin-top:4px"><button class="gh" id="back" style="padding:10px 16px">Back</button><b class="d"># ${esc(S.room.n)}</b><span class="mu">${S.peers.length||1} online</span></div>`}
  <div class="cd">${m.length?m.map(x=>`<div class="msg"><span class="av">${esc(ini(x.by))}</span><div style="min-width:0"><b>${esc(x.by)}</b> <span class="mu">${new Date(x.t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span>${body(x.txt)}</div></div>`).join(''):'<p class="mu">No messages yet. Start with a question or share a snippet inside triple backticks.</p>'}</div>
  <div class="cmp" style="margin-top:10px"><textarea id="mi" placeholder="Message ${esc(S.room.title||'#'+S.room.n)}" aria-label="Message"></textarea><button class="cta" id="snd" style="padding:14px 18px">Send</button></div>`}
const BLOCK=3000;
function silent(){const l=BLOCK-(Date.now()/1000%BLOCK);const ps=S.peers.length?S.peers:[{presence:{name:S.D.name},isMe:1}];
  return `<div class="row" style="margin-top:4px"><button class="gh" id="back" style="padding:10px 16px">Back</button><b class="d">Silent focus</b></div>
  <div class="cd" style="text-align:center"><div class="mu">Everyone’s 50 minute block ends together. Chat is off.</div><div class="big" id="rt" style="font-size:64px;margin:12px 0;color:var(--pu)">${fmt(l)}</div>
  <div class="seats">${ps.slice(0,8).map(p=>`<div class="seat" style="--k:${p.isMe?'var(--gr)':'var(--cy)'}"><div class="av">${esc(ini(p.presence.name))}</div>${esc(p.isMe?'You':p.presence.name.split(' ')[0])}</div>`).join('')}</div></div>`}

function auth(m){m=m||'in';return `<div class="auth"><div class="brand" style="font-size:34px;margin-bottom:6px">${MARK.replace(/26/g,'38')}apexfy</div><p class="mu" style="margin-bottom:26px">Deep focus, together.</p>
  <h1 style="font-size:24px">${m==='in'?'Sign in':'Create account'}</h1>
  ${m==='up'?'<input id="an" placeholder="Full name" autocomplete="name" aria-label="Full name">':''}
  <input id="ae" type="email" placeholder="Email" autocomplete="email" aria-label="Email"><input id="ap" type="password" placeholder="Password (8+ characters)" autocomplete="${m==='in'?'current-password':'new-password'}" aria-label="Password">
  <div class="err" id="er" role="alert"></div><button class="cta" id="auth" data-m="${m}" style="margin-top:8px;width:100%">${m==='in'?'Sign in':'Create account'}</button>
  <button class="mu" id="sw" data-m="${m==='in'?'up':'in'}" style="margin-top:16px;padding:8px">${m==='in'?'New here? Create an account':'Already have an account? Sign in'}</button>
  <p class="mu" style="margin-top:18px;font-size:12px">Your account and data are saved on this device only.</p></div>`}

function render(keep){
  const app=$('#app');app.classList.toggle('focus',!!(S.email&&S.run));
  if(!S.email){$('#view').innerHTML=auth(S.am);return}
  const keepS=$('#main')?.scrollTop;
  $('#view').innerHTML=`<div class="top"><button class="ib" id="menu" aria-label="Menu"><svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h16M3 11h16M3 16h10"/></svg></button><div class="brand">${MARK}apexfy</div><div style="display:flex"><button class="ib" id="dmb" aria-label="Messages" style="position:relative"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 6h18v12H3z"/><path d="M3 7l9 7 9-7"/></svg>${dmUnread()?'<span style="position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--pu)"></span>':''}</button><button class="ib" id="srch" aria-label="Search"><svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10" cy="10" r="6.5"/><path d="M15 15l4 4"/></svg></button><button class="ib" id="prof" aria-label="Profile"><span class="av" style="width:30px;height:30px">${esc(ini(S.D.name))}</span></button></div></div>
  <main id="main">${S.tab==='flow'?flow():S.tab==='comm'?comm():S.tab==='dm'?dmView():you()}</main>
  <nav class="pill">${[['flow','FlowSpace','<path d="M12 3l2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z"/>'],['comm','Community','<path d="M4 5h16v11H9l-5 4z"/>'],['you','You','<circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 15-5 16 0"/>']].map(([k,n,p])=>`<button data-t="${k}" class="${S.tab===k?'on':''}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">${p}</svg>${n}</button>`).join('')}</nav>${overlay()}`;
  if(keep&&keepS!=null)$('#main').scrollTop=keepS;paint();pres()}
setInterval(()=>{const e=$('#rt');if(e&&S.room?.silent)e.textContent=fmt(BLOCK-(Date.now()/1000%BLOCK))},1000);

function dr(o){const d=$('#dr');if(o)d.innerHTML=`<div class="brand" style="margin-bottom:18px">${MARK}apexfy</div>
  <div class="row"><span>Dark mode</span><button class="tog cy ${S.theme==='dark'?'on':''}" id="dm" aria-label="Dark mode"></button></div>
  <div class="row"><span>Haptic feedback</span><button class="tog cy ${S.haptic?'on':''}" id="hp" aria-label="Haptics"></button></div>
  <div class="row"><span>Strict Mode</span><button class="tog ${S.strict?'on':''}" id="st2" aria-label="Strict Mode"></button></div>
  ${instRow()}
  <div class="row"><div>App blocker<div class="mu">Strict Mode locks Pomodoro sessions in full screen and penalizes leaving. Browsers can’t block notifications or the home button. On Android, turn on Screen pinning for a hard lock.</div></div></div>
  <h2 style="margin-top:20px">Analytics archive</h2>${S.D.sessions.length?S.D.sessions.slice(-12).reverse().map(s=>`<div class="row" style="padding:8px 0"><span style="min-width:0"><b>${esc(s.task)}</b><div class="mu">${new Date(s.t).toLocaleDateString()} · ${s.min} min</div></span><span class="mu" style="color:${s.dist?'var(--rd)':'var(--gr)'}">${s.dist?s.dist+' distractions':'Clean'}</span></div>`).join(''):'<p class="mu">Finished sessions are archived here.</p>'}
  <button class="gh" id="out" style="margin-top:22px;width:100%;color:var(--rd)">Sign out</button>`;
  d.classList.toggle('on',o);$('#scrim').classList.toggle('on',o)}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const id=b.id,q=b.dataset;
  if(id==='auth'){const em=($('#ae').value||'').trim().toLowerCase(),pw=$('#ap').value,er=$('#er');er.textContent='';
    if(!/^\S+@\S+\.\S+$/.test(em))return er.textContent='Enter a valid email address.';if(pw.length<8)return er.textContent='Password needs at least 8 characters.';
    try{if(q.m==='up'){const n=($('#an').value||'').trim();if(!n)return er.textContent='Enter your name.';await signUp(n,em,pw)}else await signIn(em,pw)}catch(x){er.textContent=typeof x==='string'?x:'Something went wrong. Try again.'}return}
  if(id==='sw'){S.am=q.m;render();return}
  if(newH(b,id,q))return;
  if(q.t){S.tab=q.t;S.room=null;buzz(8);render()}
  else if(id==='go')start();
  else if(id==='stop')done(false);
  else if(q.m){S.mode=q.m;if(q.l)S.len=+q.l;S.brk=false;render()}
  else if(id==='strict'||id==='st2'){S.strict=!S.strict;ls.set('apx_strict',S.strict);buzz();if(id==='st2')dr(true);else render(true)}
  else if(id==='ta'){const i=$('#ti'),v=i.value.trim();if(v){const t={id:Date.now(),t:v,done:false};S.D.tasks.push(t);if(!S.D.cur)S.D.cur=t.id;save();render(true)}}
  else if(q.cur){S.D.cur=+q.cur;save();buzz(8);render(true)}
  else if(q.done){const t=S.D.tasks.find(x=>x.id===+q.done);t.done=!t.done;if(t.done){say('Task complete');buzz([20,40,20]);if(S.D.cur===t.id)S.D.cur=(S.D.tasks.find(x=>!x.done)||{}).id||null}save();render(true)}
  else if(q.del){S.D.tasks=S.D.tasks.filter(x=>x.id!==+q.del);if(S.D.cur===+q.del)S.D.cur=null;save();render(true)}
  else if(q.s){S.snd===q.s?stopSound():playSound(q.s);buzz(8);render(true)}
  else if(q.r){S.room={n:q.r,silent:q.r==='Silent focus'};buzz(8);render()}
  else if(id==='back'){S.room=null;render()}
  else if(id==='snd')sendMsg();
  else if(id==='ask'){S.aiBusy=true;render(true);try{const sm=S.D.sessions.slice(-20).map(s=>({h:new Date(s.t).getHours(),min:s.min,dist:s.dist,task:s.task}));const r=await S.sample(`You are a concise productivity coach. Given these focus sessions as JSON, give 3 short, specific tips (peak hours, distractions, next step). Under 70 words, plain text, no markdown.\n${JSON.stringify(sm)}`,{modelTier:'quick'});S.ai=r.text}catch(x){say('Coach is unavailable right now.',1)}S.aiBusy=false;render(true)}
  else if(id==='menu')dr(true);
  else if(id==='dm'){S.theme=S.theme==='dark'?'light':'dark';ls.set('apx_theme',S.theme);document.documentElement.dataset.theme=S.theme;dr(true)}
  else if(id==='hp'){S.haptic=!S.haptic;dr(true)}
  else if(id==='inst'){if(DP)DP.prompt()}
  else if(id==='out')logout();
  else if(id==='prof'){S.tab='you';S.room=null;render()}
  else if(id==='srch'){$('#sb').classList.add('on');$('#q').focus()}
  else if(id==='sx')$('#sb').classList.remove('on');
  else if(q.go){$('#sb').classList.remove('on');const[k,v]=q.go.split('|');if(k==='r'){S.tab='comm';S.room={n:v,silent:v==='Silent focus'}}else S.tab=k==='t'?'flow':'you';render()}
  else if(id==='pp'){const i=$('#pi');if(i.value.trim()){S.D.posts.push({t:i.value.trim(),at:Date.now()});save();render(true)}}
  else if(id==='share'){S.D.posts.push({t:`${hrs().toFixed(1)}h of deep work, ${xp()} XP, rank ${RANKS[rank()][0]}, ${streak()} day streak.`,at:Date.now()});save();say('Shared to your activity');render(true)}
  else if(id==='edit'){S.editing=true;render(true)}
  else if(id==='esave'){S.D.name=$('#en').value.trim()||S.D.name;S.D.age=$('#ea').value.trim();S.D.loc=$('#el').value.trim();S.D.skills=$('#ek').value.split(',').map(x=>x.trim()).filter(Boolean).slice(0,8);S.editing=false;save();render(true)}
});
$('#scrim').onclick=()=>dr(false);
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='ap')$('#auth').click();if(e.key==='Enter'&&e.target.id==='mi'&&!e.shiftKey){e.preventDefault();sendMsg()}if(e.key==='Escape'){dr(false);$('#sb').classList.remove('on')}});
$('#q').oninput=e=>{if(!S.D)return;const v=e.target.value.toLowerCase().trim();if(!v){$('#sr').innerHTML='';return}
  const hits=[];CH.forEach(([c,l])=>l.forEach(n=>n.toLowerCase().includes(v)&&hits.push(['r|'+n,'#',n])));S.D.tasks.forEach(t=>t.t.toLowerCase().includes(v)&&hits.push(['t|x','Task',t.t]));S.D.posts.forEach(p=>p.t.toLowerCase().includes(v)&&hits.push(['y|x','Post',p.t]));
  $('#sr').innerHTML=hits.length?hits.map(h=>`<button class="ch" data-go="${esc(h[0])}"><span class="mu" style="width:40px">${h[1]}</span><span style="text-align:left">${esc(h[2])}</span></button>`).join(''):'<p class="mu">No matches. Try a room, task or post.</p>'};
/* ---------- install as app (PWA) ---------- */
let DP=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();DP=e});
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
function instRow(){if(standalone)return'';return `<div class="row"><div>Install as an app<div class="mu">${DP?'Add Apexfy to your home screen.':ios?'In Safari tap Share, then Add to Home Screen.':'In Chrome open the menu, then Install app or Add to Home screen.'}</div></div>${DP?'<button class="gh" id="inst">Install</button>':''}</div>`}
const ss=ls.get('apx_session',null);if(ss&&ls.get('apx_d_'+ss,null)){login(ss)}else render();
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
</body>
